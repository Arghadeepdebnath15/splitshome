# Render Blueprint — auto-deploy from GitHub
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: flatmate-api
    runtime: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false          # set manually in Render dashboard
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: 30d
      - key: CLIENT_URL
        sync: false          # your Vercel URL, e.g. https://flatmate-app.vercel.app

